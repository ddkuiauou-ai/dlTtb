name: Build Static JSON Content

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build singular tasks in parallel
  build_singular:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ["search-index", "post-details", "keyword-pages"]
      fail-fast: false
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Check DB environment variables
        run: |
          missing=0
          for k in POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
            if [ -z "${!k}" ]; then echo "::error::$k is empty (missing corresponding secret)"; missing=1; fi
          done
          if [ $missing -ne 0 ]; then exit 1; fi

      - name: Build search index
        if: matrix.task == 'search-index'
        run: pnpm tsx scripts/build-search-index.ts
      - name: Validate output layout
        if: matrix.task == 'search-index'
        run: |
          set -euo pipefail
          test -f public/data/search-index.json
          if [ -d public/data/v1 ]; then
            echo "::error::Found unexpected 'public/data/v1'. Producers must write under posts/v1 or proper subtrees."
            exit 1
          fi

      - name: Build all post details
        if: matrix.task == 'post-details'
        run: pnpm tsx scripts/build-post-json.ts
      - name: Validate output layout
        if: matrix.task == 'post-details'
        run: |
          set -euo pipefail
          test -d public/data/posts/v1
          if [ -d public/data/v1 ]; then
            echo "::error::Found unexpected 'public/data/v1'. Producers must write under posts/v1."
            exit 1
          fi

      - name: Build all keyword pages
        if: matrix.task == 'keyword-pages'
        run: pnpm tsx scripts/build-keyword-json.ts
      - name: Validate output layout
        if: matrix.task == 'keyword-pages'
        run: |
          set -euo pipefail
          test -d public/data/keywords
          if [ -d public/data/v1 ]; then
            echo "::error::Found unexpected 'public/data/v1'. Producers must write under proper subtrees."
            exit 1
          fi

      - name: Upload singular build artifact (search-index)
        if: matrix.task == 'search-index'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-singular-search-index
          path: public/data
          if-no-files-found: error
          retention-days: 3

      - name: Upload singular build artifact (post-details)
        if: matrix.task == 'post-details'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-singular-post-details
          path: public/data
          if-no-files-found: error
          retention-days: 3

      - name: Upload singular build artifact (keyword-pages)
        if: matrix.task == 'keyword-pages'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-singular-keyword-pages
          path: public/data
          if-no-files-found: error
          retention-days: 3

  # Build main pages (only fresh|24h as needed for infinite scroll)
  build_main:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Check DB environment variables
        run: |
          missing=0
          for k in POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
            if [ -z "${!k}" ]; then echo "::error::$k is empty (missing corresponding secret)"; missing=1; fi
          done
          if [ $missing -ne 0 ]; then exit 1; fi
      - name: Build main pages (fresh|24h only)
        run: pnpm tsx scripts/build-main-json.ts
        env:
          RANGE: 24h
          SECTION: fresh
      - name: Validate output layout
        run: |
          set -euo pipefail
          test -d "public/data/home/v1/24h/fresh"
          if [ -d public/data/v1 ]; then
            echo "::error::Found unexpected 'public/data/v1'."
            exit 1
          fi
      - name: Upload main build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-main-24h-fresh
          path: public/data
          if-no-files-found: error
          retention-days: 3

  # Build category pages in parallel
  build_categories:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        category:
          [
            "all",
            "humor",
            "video",
            "youtube",
            "info",
            "it",
            "sports",
            "game",
            "qna",
            "review",
            "news",
            "debate",
            "back",
            "zzal",
            "politics",
            "shopping",
            "etc",
          ]
        range: ["3h", "6h", "24h", "1w"]
      fail-fast: false
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Check DB environment variables
        run: |
          missing=0
          for k in POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
            if [ -z "${!k}" ]; then echo "::error::$k is empty (missing corresponding secret)"; missing=1; fi
          done
          if [ $missing -ne 0 ]; then exit 1; fi
      - name: Build category pages
        run: pnpm tsx scripts/build-category-json.ts ${{ matrix.category }} ${{ matrix.range }}
      - name: Validate output layout
        run: |
          set -euo pipefail
          test -d "public/data/category/${{ matrix.category }}/v1/${{ matrix.range }}"
          if [ -d public/data/v1 ]; then
            echo "::error::Found unexpected 'public/data/v1'."
            exit 1
          fi
      - name: Upload category artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-category-${{ matrix.category }}-${{ matrix.range }}
          path: public/data
          if-no-files-found: error
          retention-days: 3

  # Build all-posts pages in parallel
  build_all_posts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        range: ["3h", "6h", "24h", "1w"]
      fail-fast: false
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Check DB environment variables
        run: |
          missing=0
          for k in POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
            if [ -z "${!k}" ]; then echo "::error::$k is empty (missing corresponding secret)"; missing=1; fi
          done
          if [ $missing -ne 0 ]; then exit 1; fi
      - name: Build all posts pages
        run: pnpm tsx scripts/build-allposts-json.ts ${{ matrix.range }}
      - name: Validate output layout
        run: |
          set -euo pipefail
          test -d "public/data/all/v1/${{ matrix.range }}"
          if [ -d public/data/v1 ]; then
            echo "::error::Found unexpected 'public/data/v1'."
            exit 1
          fi
      - name: Upload all-posts artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-allposts-${{ matrix.range }}
          path: public/data
          if-no-files-found: error
          retention-days: 3

  # Deploy main site with HTML pages
  deploy_main_site:
    runs-on: ubuntu-latest
    needs: [build_singular, build_main, build_categories, build_all_posts]
    permissions:
      contents: read
      deployments: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --silent

      - name: Download singular build artifacts (search-index and keyword-pages)
        uses: actions/download-artifact@v4
        with:
          name: artifact-singular-search-index
          path: artifacts/search-index

      - name: Download singular build artifacts (keyword-pages)
        uses: actions/download-artifact@v4
        with:
          name: artifact-singular-keyword-pages
          path: artifacts/keyword-pages

      - name: Download main build artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact-main-24h-fresh
          path: artifacts/main

      - name: Download category build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-category-*
          path: artifacts/category
          merge-multiple: true

      - name: Download all-posts build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-allposts-*
          path: artifacts/allposts
          merge-multiple: true

      - name: Combine all artifacts
        run: |
          set -euo pipefail
          mkdir -p public/data
          for artifact_dir in artifacts/*/; do
            [ -d "$artifact_dir" ] && rsync -a "$artifact_dir" public/data/
          done

      - name: Check Clerk publishable key
        run: |
          KEY='${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}'
          if [ -z "$KEY" ]; then
            echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY secret is empty."
            exit 1
          fi

      - name: Build & Export Next.js
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          pnpm next build

      - name: Deploy Main Site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.TOKEN_GITHUB_COM }}

  # Upload post-details JSON to R2 bucket
  upload_json_to_r2:
    runs-on: ubuntu-latest
    needs: [build_singular]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: apac
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download post-details artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-singular-post-details
          path: data

      - name: Validate post-details data
        run: |
          set -euo pipefail
          test -d data/posts/v1

      - name: Upload post-details JSON to R2
        run: |
          aws s3 sync ./data s3://${{ env.R2_BUCKET_NAME }}/data/ \
            --endpoint-url ${{ env.R2_ENDPOINT_URL }}
